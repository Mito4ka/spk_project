<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СПК БОТ - Подключение</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="big-screen">

    <div class="screen-wrapper">
        
        <!-- Фоновая графика (как на макете) -->
        <div class="bg-shape shape-top-left"></div>
        <div class="bg-shape shape-bottom-right"></div>

        <main class="main-content">
            <!-- Логотип -->
            <div class="logo-wrapper">
                <div class="logo-circle">
                    <span class="logo-main">СПК</span>
                    <span class="logo-sub">БОТ</span>
                </div>
            </div>

            <!-- QR-код -->
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=http://127.0.0.1:5500/mobile.html" alt="QR Code">
            </div>
            
            <!-- Текст -->
            <p class="instruction-text">Наведите камеру телефона, чтобы участвовать</p>
        </main>

    </div>

</body>
</html>
