<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СПК - Модератор</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #6878B8; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .screen { display: none; width: 100%; max-width: 1000px; }
        .screen.active { display: block; }
        
        /* Вход */
        .login-box { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; text-align: center; backdrop-filter: blur(10px); max-width: 400px; margin: 0 auto; }
        input { padding: 15px; width: 100%; border-radius: 10px; border: none; margin-bottom: 15px; font-size: 16px; }
        .btn { padding: 15px 30px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; background: #E85D35; color: white; width: 100%; }
        
        /* Панель */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px;}
        .counter { font-size: 20px; font-weight: bold; background: #F2C94C; color: #333; padding: 5px 15px; border-radius: 20px;}
        
        /* Сетка */
        .dashboard { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .column { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; }
        .column h2 { margin-bottom: 15px; font-size: 20px; }
        
        ul { list-style: none; }
        li { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        
        .btn-approve { background: #5cb85c; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-ban { background: #d9534f; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        
        .blacklist-input { display: flex; gap: 10px; margin-top: 20px; }
        .blacklist-input input { margin-bottom: 0; }
    </style>
</head>
<body>

    <!-- Вход -->
    <div id="login-screen" class="screen active">
        <div class="login-box">
            <h2 style="margin-bottom: 20px;">Вход для модератора</h2>
            <input type="password" id="pass" placeholder="Введите пароль (1234)">
            <button class="btn" onclick="login()">Войти</button>
        </div>
    </div>

    <!-- Панель -->
    <div id="panel-screen" class="screen">
        <div class="header">
            <h2>Панель управления</h2>
            <div class="counter">Подключено: <span id="count">0</span></div>
        </div>
        
        <div class="dashboard">
            <!-- Левая колонка: Очередь слов -->
            <div class="column">
                <h2>Очередь слов (на модерации)</h2>
                <ul id="words-list">
                    <li>Пока пусто...</li>
                </ul>
            </div>
            
            <!-- Правая колонка: Черный список -->
            <div class="column">
                <h2>Черный список</h2>
                <ul id="blacklist">
                    <li>Нет забаненных слов</li>
                </ul>
                <div class="blacklist-input">
                    <input type="text" id="banWord" placeholder="Мат...">
                    <button class="btn" onclick="addToBlacklist()">Добавить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let banList = ["плохоеслово", "мат", "дурак"]; // Предзаполненный бан-лист

        function login() {
            const p = document.getElementById('pass').value;
            if (p === "1234") {
                document.getElementById('login-screen').classList.remove('active');
                document.getElementById('panel-screen').classList.add('active');
                startMonitoring(); // Запускаем слежку за словами
            } else {
                alert("Неверный пароль!");
            }
        }

        // Функция, которая каждые 2 секунды смотрит в память
        function startMonitoring() {
            setInterval(() => {
                // Считаем подключенных (сколько раз сохранялось имя)
                let users = localStorage.getItem('spk_user') ? 1 : 0; 
                document.getElementById('count').textContent = users;

                // Читаем слова
                let words = JSON.parse(localStorage.getItem('spk_words') || "[]");
                let pendingWords = words.filter(w => w.status === "pending");

                const list = document.getElementById('words-list');
                list.innerHTML = '';

                if (pendingWords.length === 0) {
                    list.innerHTML = '<li>Нет новых слов</li>';
                    return;
                }

                pendingWords.forEach(word => {
                    // Проверка на мат
                    let isBanned = banList.some(badWord => word.text.toLowerCase().includes(badWord));
                    let statusText = isBanned ? "🚫 Забанено" : "⏳ На проверке";

                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span><strong>${word.text}</strong> (от ${word.author}) - ${statusText}</span>
                        <div>
                            ${!isBanned ? `<button class="btn-approve" onclick="approveWord(${word.id})">✅</button>` : ''}
                            <button class="btn-ban" onclick="banWord(${word.id})">🚫</button>
                        </div>
                    `;
                    list.appendChild(li);
                });

            }, 2000); // Обновление каждые 2 секунды
        }

        // Одобрить слово (оно улетит в облако)
        function approveWord(id) {
            let words = JSON.parse(localStorage.getItem('spk_words') || "[]");
            let word = words.find(w => w.id === id);
            if (word) word.status = "approved";
            localStorage.setItem('spk_words', JSON.stringify(words));
        }

        // Забанить слово
        function banWord(id) {
            let words = JSON.parse(localStorage.getItem('spk_words') || "[]");
            let word = words.find(w => w.id === id);
            if (word) {
                // Добавляем в бан-лист
                banList.push(word.text.toLowerCase());
                word.status = "banned";
                renderBlacklist();
            }
            localStorage.setItem('spk_words', JSON.stringify(words));
        }

        // Добавить в черный список вручную
        function addToBlacklist() {
            const input = document.getElementById('banWord');
            if (input.value.trim()) {
                banList.push(input.value.trim().toLowerCase());
                input.value = '';
                renderBlacklist();
            }
        }

        function renderBlacklist() {
            const list = document.getElementById('blacklist');
            list.innerHTML = '';
            banList.forEach(w => {
                list.innerHTML += `<li>${w}</li>`;
            });
        }

        // Инициализация
        renderBlacklist();
    </script>
</body>
</html>
