<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СПК - Облако слов</title>
    <link rel="stylesheet" href="cloud.css">
    <!-- библиотекa для конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="big-screen">

    <div class="screen-wrapper">
        
        <div class="bg-shape shape-top-left"></div>
        <div class="bg-shape shape-bottom-right"></div>

        
        <header class="cloud-header">
            <h1>Опишите свое настроение</h1>
        </header>

       
        <main class="word-cloud-container" id="word-cloud">
            <!-- Слова будут добавляться сюда через JavaScript -->
        </main>

        <!-- QR-код  -->
        <div class="qr-corner">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=http://127.0.0.1:5500/mobile.html" alt="QR">
            <p>Сканируй!</p>
        </div>
    </div>

    <!-- конфетти -->
    <script>
        document.body.addEventListener('click', function(e) {
            confetti({
                particleCount: 50,
                spread: 70,
                origin: { x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight },
                colors: ['#E85D35', '#F2C94C', '#ffffff', '#4A5C9A']
            });
        });
    </script>
    
    
    <script src="cloud.js"></script>
</body>
</html>
